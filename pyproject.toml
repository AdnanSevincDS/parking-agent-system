[project]
name = "parking-agent-system"
version = "0.1.0"
description = "RAG-based parking reservation chatbot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arize-phoenix>=20.4.0",
    "dateparser>=1.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-core>=1.6.0",
    "langchain-milvus>=0.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "openinference-instrumentation-langchain>=0.1.73",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-settings>=2.15.0",
    "pymilvus>=3.0.1",
    "pyyaml>=6.0.3",
    "streamlit>=1.62.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parking_agent_system"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
